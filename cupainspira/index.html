<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CUPA Inspira — Visiones AC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --red: #7a1410;
    --red-deep: #5e0f0c;
    --green: #0d3e23;
    --green-deep: #082a17;
    --cream: #fbf3dc;
    --cream-soft: #f4e8cd;
    --brown: #5b4a36;
    --brown-soft: #8a775f;
    --line: rgba(91, 74, 54, 0.18);
    --line-strong: rgba(91, 74, 54, 0.32);
    --serif: "Newsreader", Georgia, serif;
    --sans: "Hanken Grotesk", system-ui, sans-serif;
    --maxw: 1180px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--cream);
    color: var(--brown);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--red); color: var(--cream); }

  .wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }

  a { color: inherit; text-decoration: none; }

  /* keyframes */
  @keyframes floatUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  image-slot { display: block; background: var(--cream-soft); }

  nav::-webkit-scrollbar { display: none; }
  nav { scrollbar-width: none; }

  .footlink { transition: color .18s ease; }
  .footlink:hover { color: #fbf3dc !important; }

  #root { min-height: 100vh; }
</style>
</head>
